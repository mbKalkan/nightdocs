name: Bug report
description: Something doesn't look or work right
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected and what you saw. A screenshot helps a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a .xlsx file with …
        2. …
  - type: dropdown
    id: format
    attributes:
      label: File type
      options:
        - Word (.docx)
        - Excel (.xlsx / .xlsm)
        - Other
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Nightdocs, VS Code and OS versions (Help › About in VS Code shows the last two).
      placeholder: Nightdocs 0.1.0, VS Code 1.100.0, Windows 11
    validations:
      required: true
  - type: input
    id: theme
    attributes:
      label: Color theme
      placeholder: Dark Modern
  - type: textarea
    id: file
    attributes:
      label: Sample file
      description: >-
        If you can, attach a small file that shows the problem. Please remove anything private
        first.
